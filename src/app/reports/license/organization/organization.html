<div class="report-toolbar" role="toolbar" aria-label="Organization filters">
  <app-search-filter [(text)]="filters.search" />

  <span class="filter-divider" aria-hidden="true"></span>

  <div class="toolbar-filters">
    <div class="filter-cluster">
      <app-range-filter [(range)]="filters.range" />
      <app-option-filter [(option)]="filters.option" />
      <app-feature-group-filter [(group)]="filters.featureGroup" />
    </div>

    <span class="filter-divider" aria-hidden="true"></span>

    <div class="filter-cluster">
      @if (filters.settings(); as limits) {
        <app-usage-band-filter [(selected)]="filters.bands" [limits]="limits" />
      }
      <app-server-status-filter [(status)]="filters.serverStatus" />
      <app-expiry-filter [(notExpired)]="filters.notExpired" />
    </div>
  </div>

  <div class="toolbar-trailing">
    @if (rowCountLabel()) {
      <span class="row-count">Rows : {{ rowCountLabel() }}</span>
    }
    <button type="button" class="view-toggle" (click)="toggleView()">
      {{ view() === 'grid' ? 'Gauge View' : 'Grid View' }}
    </button>
  </div>
</div>

@if (view() === 'grid') {
  <app-data-grid
    [rows]="rows()"
    [columns]="columns()"
    [hiddenColumns]="filters.myColumns()"
    [search]="filters.search()"
    [loading]="data.loading()"
    [emptyText]="data.error()"
    (rowCount)="rowCount.set($event)"
    (filtersCleared)="clearFilters()"
  />
} @else if (filters.settings(); as limits) {
  @if (tiles().length) {
    <div class="gauge-grid">
      @for (tile of tiles(); track tile.title) {
        <app-gauge-tile
          [title]="tile.title"
          [percent]="tile.percent"
          [stats]="tile.stats"
          [limits]="limits"
        />
      }
    </div>
  } @else {
    <p class="gauge-empty">{{ data.error() || 'No data to show.' }}</p>
  }
}
