<app-report-action-bar
  label="License report views"
  [actions]="actions()"
  [activeId]="activeAction().id"
  [busy]="loading()"
  (actionSelected)="selectAction($event)"
/>
@if (loading()) {
  <output class="opening-status">Opening {{ activeAction().label }}…</output>
}
@if (error()) {
  <div class="open-error" role="alert">
    <span>{{ error() }}</span>
    <button type="button" (click)="retry()">Retry</button>
  </div>
}
