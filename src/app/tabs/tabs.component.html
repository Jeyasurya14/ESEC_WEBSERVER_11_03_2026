<div class="tab-strip" role="tablist" aria-label="Open reports">
  @for (tab of tabService.tabs(); track tab.id) {
    <div class="tab" [class.active]="tab.id === tabService.activeId()" (contextmenu)="openMenu($event, tab)">
      <button
        type="button"
        class="tab-label"
        role="tab"
        [id]="'tab-' + tab.id"
        [attr.aria-selected]="tab.id === tabService.activeId()"
        [attr.aria-controls]="'panel-' + tab.id"
        [tabindex]="tab.id === tabService.activeId() ? 0 : -1"
        (click)="tabService.activate(tab.id)"
        (keydown)="onKeydown($event, tab)"
      >
        @if (tab.pinned) {
          <span class="pin" title="Pinned" aria-label="Pinned">&#x1F4CC;</span>
        }
        <span class="title">{{ tab.menu.subMenuName }}</span>
        <span class="group">{{ tab.menu.mainMenuName }}</span>
      </button>
      <button
        type="button"
        class="tab-close"
        [attr.aria-label]="'Close ' + tab.menu.subMenuName"
        tabindex="-1"
        (click)="tabService.close(tab.id)"
      >
        &#x2715;
      </button>
    </div>
  }
</div>

<div class="tab-panels">
  @for (tab of tabService.tabs(); track tab.id) {
    <!-- Hidden, not destroyed, so a report keeps its state while another tab is in front. -->
    <section
      class="tab-panel"
      role="tabpanel"
      [id]="'panel-' + tab.id"
      [attr.aria-labelledby]="'tab-' + tab.id"
      [hidden]="tab.id !== tabService.activeId()"
    >
      <ng-container *ngComponentOutlet="tab.component; inputs: { menu: tab.menu }" />
    </section>
  }
</div>

@if (menu(); as open) {
  <ul class="context-menu" role="menu" [style.left.px]="open.x" [style.top.px]="open.y">
    @if (!open.tab.pinned) {
      <li role="none"><button role="menuitem" type="button" (click)="run('closeAll')">Close All</button></li>
      <li role="none"><button role="menuitem" type="button" (click)="run('closeOthers')">Close All But This</button></li>
    }
    @if (tabService.canCloseLeftOf(open.tab.id)) {
      <li role="none"><button role="menuitem" type="button" (click)="run('closeLeft')">Close Tabs to the Left</button></li>
    }
    @if (tabService.canCloseRightOf(open.tab.id)) {
      <li role="none"><button role="menuitem" type="button" (click)="run('closeRight')">Close Tabs to the Right</button></li>
    }
    <li role="none"><button role="menuitem" type="button" (click)="run('togglePin')">{{ open.tab.pinned ? 'Unpin Tab' : 'Pin Tab' }}</button></li>
  </ul>
}
